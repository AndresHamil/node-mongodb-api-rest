version: '3.8'

services:
  mongodb:
    image: mongo:7.0-alpine
    container_name: valian-mongodb-prod
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-admin123}
      MONGO_INITDB_DATABASE: valian
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - valian-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: valian-api-prod
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_DATABASE_NAME: ${MONGODB_DATABASE_NAME:-valian}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - valian-network

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

networks:
  valian-network:
    driver: bridge
